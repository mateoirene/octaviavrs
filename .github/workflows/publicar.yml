name: Publicar web del club
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/cloudflare-target.mjs'
      - '.github/workflows/publicar.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-octaviaap
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener la web
        uses: actions/checkout@v6
      - name: Comprobar acceso y proyecto de destino
        id: destino
        run: node scripts/cloudflare-target.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publicar en octaviaap.pages.dev
        if: steps.destino.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=octaviaap --branch=${{ steps.destino.outputs.branch }}
