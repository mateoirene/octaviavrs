name: Publicar web del club
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - 'server/**'
      - 'functions/**'
      - 'tests/**'
      - 'migrations/**'
      - '.github/backup/**'
      - '.github/workflows/publicar.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-octaviaap-visual-fast
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: '71fb53fce0685a83a5b15712414cfc25'
    steps:
      - name: Obtener la web
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detectar publicación rápida
        id: cambios
        shell: bash
        run: |
          echo "solo_css=false" >> "$GITHUB_OUTPUT"
          echo "solo_visual=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "${{ github.event.before }}" ]; then exit 0; fi
          archivos="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          if [ -z "$archivos" ]; then exit 0; fi
          solo_css=true
          solo_visual=true
          while IFS= read -r archivo; do
            case "$archivo" in
              dist/navigation-premium.css|dist/club-news.css) ;;
              *) solo_css=false ;;
            esac
            case "$archivo" in
              dist/*.css|dist/*.html|dist/*.mjs|dist/*.js|dist/assets/*|.github/workflows/publicar.yml) ;;
              *) solo_visual=false ;;
            esac
          done <<< "$archivos"
          if [ "$solo_css" = true ]; then echo "solo_css=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$solo_visual" = true ]; then echo "solo_visual=true" >> "$GITHUB_OUTPUT"; fi
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar imágenes locales para todas las publicaciones
        run: node scripts/prepare-local-images.mjs
      - name: Comprobar privacidad y moderación
        if: steps.cambios.outputs.solo_css != 'true'
        run: node --test tests/*.test.mjs
      # Pages reemplaza el conjunto de archivos: recuperar también los recursos
      # generados en los despliegues rápidos para no retirar fotos ni Three.js.
      - name: Recuperar fotografías del circuito
        uses: actions/cache@v4
        with:
          path: dist/assets/race
          key: octavia-race-photos-20261023-v1
      - name: Preparar fotografías y atribuciones
        run: node scripts/prepare-race-assets.mjs
      - name: Recuperar motor y materiales 3D
        uses: actions/cache@v4
        with:
          path: |
            dist/vendor
            dist/assets/track3d
          key: octavia-track3d-three0180-asphalt02-v1
      - name: Preparar motor local y materiales PBR
        run: node scripts/prepare-track3d.mjs
      - name: Comprobar garaje y circuito en Chrome
        if: steps.cambios.outputs.solo_css != 'true' && steps.cambios.outputs.solo_visual != 'true'
        run: node scripts/browser-check.mjs
      - name: Guardar vistas de comprobación
        if: always() && steps.cambios.outputs.solo_css != 'true' && steps.cambios.outputs.solo_visual != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vistas-garaje-circuito
          path: artifacts/*.jpg
          if-no-files-found: ignore
      - name: Comprobar acceso y proyecto de destino
        id: destino
        run: node scripts/cloudflare-target.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Respaldo completo cifrado de la D1 de producción antes de tocar datos.
      - name: Preparar Python para el respaldo
        if: steps.destino.outputs.ready == 'true' && steps.cambios.outputs.solo_css != 'true' && steps.cambios.outputs.solo_visual != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Crear respaldo completo y cifrado de producción
        if: steps.destino.outputs.ready == 'true' && steps.cambios.outputs.solo_css != 'true' && steps.cambios.outputs.solo_visual != 'true'
        run: node .github/backup/crear-copia.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKUP_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAlohmGtAR2bzi5f7CvqGN
            MPaPtatASz3cUtvBS7YPcrxjuM5/hQDEEsJT6RWTDTvzng8yhUdP04dwz3gMC9iY
            LNaJLZ7B2PyrY5HdS8XyrIdDQ5C3nlxPmIWZ84lvYMJ74rE5RV1MX7aTGOU2P7pN
            bfLTkKqoguLfHxEUTpnGqlJxJB6+dARRXk4R0a3mHouAE/LPGShKF24GP3Im5dkz
            Lno1IzKyWoMY0SSNQmYa1STvoaCb+/EAmmrfGhEOZijdnhi/fAlMUX89TLP7jWsd
            +SuDIkaJRl9TLQQSEN2dLp/Wt1m/yOdspM7AO+t7yKshCqHuT1fr23ZvBwbQLtb9
            z2KV4MmZ9ZYbBU2pJUSNowaUiuui9O9r94SHXVaA1DyVcgQwiUdLmKQF1V9v6bUr
            5D3fiUvEaKiwHYOMJUgO8/MPODvT8J1Lp9EqI3Fmsj0wkG6VKnWKaWanS/4rx404G6
            rrx1bLgzpIxkJSir7/poLb+yY5mbxW5AsLfd2/FWxN6LnlOlVlQ1Ch65hMXnRAh4
            RhcH/CLaim+rGfFYvrbF4opVbK1OU+gS2TRztJKY70pQ5MzmAXjZ1UpwzjxkEbW2
            /zPY0+kk9TMGh2SpRWm9Rs8CAwEAAQ==
            -----END PUBLIC KEY-----
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
      - name: Conservar el respaldo previo al cambio
        if: steps.destino.outputs.ready == 'true' && steps.cambios.outputs.solo_css != 'true' && steps.cambios.outputs.solo_visual != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: copia-seguridad-octavia-web-previa-${{ github.run_id }}
          path: /tmp/octavia-security/entrega
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Aplicar migración del centro de control
        if: steps.destino.outputs.ready == 'true' && steps.cambios.outputs.solo_css != 'true' && steps.cambios.outputs.solo_visual != 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute octavia-club-mercadillo --remote --file=migrations/2026-11-10-cms.sql
      - name: Aplicar migración de visibilidad de fichas
        if: steps.destino.outputs.ready == 'true' && steps.cambios.outputs.solo_css != 'true' && steps.cambios.outputs.solo_visual != 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute octavia-club-mercadillo --remote --file=migrations/2026-11-10-garage-member-visibility.sql
      - name: Preparar almacenamiento del mercadillo
        if: steps.destino.outputs.ready == 'true' && steps.cambios.outputs.solo_css != 'true' && steps.cambios.outputs.solo_visual != 'true'
        run: node scripts/market-storage.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Sincronizar avisos push del club
        if: steps.destino.outputs.ready == 'true' && steps.cambios.outputs.solo_css != 'true' && steps.cambios.outputs.solo_visual != 'true'
        run: node scripts/push-news.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Publicar en octaviaap.pages.dev
        if: steps.destino.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=octaviaap --branch=${{ steps.destino.outputs.branch }}

      - name: Verificar fotografías y acceso al circuito publicado
        if: steps.destino.outputs.ready == 'true'
        run: node scripts/check-racing-live.mjs

