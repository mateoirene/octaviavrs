name: Publicar web del club
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - 'server/**'
      - 'functions/**'
      - 'tests/**'
      - '.github/workflows/publicar.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-octaviaap
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: '71fb53fce0685a83a5b15712414cfc25'
    steps:
      - name: Obtener la web
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detectar publicación solo visual
        id: cambios
        shell: bash
        run: |
          echo "solo_css=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "${{ github.event.before }}" ]; then exit 0; fi
          archivos="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          if [ -z "$archivos" ]; then exit 0; fi
          while IFS= read -r archivo; do
            case "$archivo" in
              dist/navigation-premium.css|.github/workflows/publicar.yml) ;;
              *) exit 0 ;;
            esac
          done <<< "$archivos"
          echo "solo_css=true" >> "$GITHUB_OUTPUT"
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Comprobar privacidad y moderación
        run: node --test tests/*.test.mjs
      - name: Recuperar fotografías del circuito
        uses: actions/cache@v4
        with:
          path: dist/assets/race
          key: octavia-race-photos-20261023-v1
      - name: Preparar fotografías y atribuciones
        run: node scripts/prepare-race-assets.mjs
      - name: Recuperar motor y materiales 3D
        uses: actions/cache@v4
        with:
          path: |
            dist/vendor
            dist/assets/track3d
          key: octavia-track3d-three0180-asphalt02-v1
      - name: Preparar motor local y materiales PBR
        run: node scripts/prepare-track3d.mjs
      - name: Comprobar garaje y circuito en Chrome
        run: node scripts/browser-check.mjs
      - name: Guardar vistas de comprobación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vistas-garaje-circuito
          path: artifacts/*.jpg
          if-no-files-found: ignore
      - name: Comprobar acceso y proyecto de destino
        id: destino
        run: node scripts/cloudflare-target.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Preparar almacenamiento del mercadillo
        if: steps.destino.outputs.ready == 'true' && steps.cambios.outputs.solo_css != 'true'
        run: node scripts/market-storage.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Sincronizar avisos push del club
        if: steps.destino.outputs.ready == 'true' && steps.cambios.outputs.solo_css != 'true'
        run: node scripts/push-news.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Publicar en octaviaap.pages.dev
        if: steps.destino.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=octaviaap --branch=${{ steps.destino.outputs.branch }}

      - name: Verificar fotografías y acceso al circuito publicado
        if: steps.destino.outputs.ready == 'true'
        run: node scripts/check-racing-live.mjs
