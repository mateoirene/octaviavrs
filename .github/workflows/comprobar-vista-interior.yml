name: Comprobar referencia del habitáculo
on:
  push:
    paths: ['.github/workflows/comprobar-vista-interior.yml']
jobs:
  referencia:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar referencia visual
        run: |
          curl -fsSL https://f.magazynauto.pl/magazynauto_prod_2021_09/16325988046f08a8.jpg -o /tmp/interior.jpg
          python - <<'PY'
          from PIL import Image
          import io,base64
          im=Image.open('/tmp/interior.jpg'); print('SIZE',im.size);im.thumbnail((980,490)); out=io.BytesIO(); im.save(out,format='JPEG',quality=85)
          print('VISTA_REFERENCE '+base64.b64encode(out.getvalue()).decode())
          PY
