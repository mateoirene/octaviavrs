name: Cambiar identidad administrativa autorizada
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cambiar-identidad-admin.yml', '.github/identity/change-admin-email.mjs']
permissions:
  contents: read
concurrency:
  group: octavia-admin-identity
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Auditar vínculo y conservar la cuenta administrativa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/identity/change-admin-email.mjs
