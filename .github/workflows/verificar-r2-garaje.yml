name: Verificar acceso R2 de la vista previa del garaje
on:
  push:
    branches: [codex/garaje-r2-acceso]
permissions: {}
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar el proyecto y R2 sin modificar ajustes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 71fb53fce0685a83a5b15712414cfc25
        run: |
          node --input-type=module <<'JS'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) { console.log('El secreto de despliegue no está disponible.'); process.exit(1); }
          const base = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID;
          for (const [label,path] of [['Pages','/pages/projects/octaviaap'],['R2','/r2/buckets']]) {
            const response = await fetch(base + path,{headers:{Authorization:'Bearer ' + token}});
            const data = await response.json();
            console.log(label, response.status, JSON.stringify(label === 'Pages' && data.success
              ? {previewBinding: data.result.deployment_configs?.preview?.r2_buckets?.GARAGE_PUBLIC_R2?.name ?? null}
              : label === 'R2' && data.success ? {previewBucketExists: data.result.buckets.some(bucket => bucket.name === 'octaviaap-garaje-preview')} : {codes:data.errors?.map(error => error.code)}));
          }
          JS
