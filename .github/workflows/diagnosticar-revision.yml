name: Diagnosticar revisión del mercadillo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnosticar-revision.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Comprobar anuncios y acceso sin leer datos personales
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/71fb53fce0685a83a5b15712414cfc25';
          async function cf(path,body){const response=await fetch(root+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const value=await response.json();if(!response.ok||!value.success)throw new Error('No se pudo realizar el diagnóstico de almacenamiento.');return value.result;}
          const databases=await cf('/d1/database?name=octavia-club-mercadillo');
          const database=databases.find(item=>item.name==='octavia-club-mercadillo');
          if(!database)throw new Error('No se encontró el almacenamiento.');
          const rows=await cf('/d1/database/'+database.uuid+'/query',{sql:"SELECT (SELECT COUNT(*) FROM market_admins) AS administradores, (SELECT COUNT(*) FROM market_listings WHERE status='pending') AS pendientes, (SELECT COUNT(*) FROM market_listings WHERE status='approved') AS publicados, (SELECT COUNT(*) FROM market_listings WHERE status='rejected') AS rechazados, (SELECT COUNT(*) FROM market_sessions WHERE expires_at>unixepoch()) AS sesiones_activas"});
          console.log('REVISION_DIAGNOSTICO '+JSON.stringify(rows[0].results[0]));
          const response=await fetch('https://octaviaap.pages.dev/api/market/status',{cache:'no-store'});
          console.log('REVISION_ACCESO '+JSON.stringify(await response.json()));
          NODE
