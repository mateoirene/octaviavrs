<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Circuito · comprobación de apoyo</title><style>body{margin:0;background:#101820;color:white;font:16px system-ui}main{max-width:940px;margin:auto;padding:16px}button,a{display:inline-block;padding:14px;margin:4px;background:#263744;color:white;border:1px solid #7b8b95;border-radius:8px}#stage{position:relative;width:100%;height:min(72vh,900px);overflow:hidden;border:1px solid #8a949c}canvas{display:block;position:absolute;inset:0;width:100%;height:100%}p{line-height:1.5}</style><main><h1>Circuito · apoyo del coche y asfalto</h1><p>Comprobación aislada del coche negro fotográfico. Sin guardar resultados ni acceder a datos reales.</p><button id="finish">Llegada</button><button id="drive">En carrera</button><a href="simulador.html?experience=circuit">Abrir circuito</a><p id="status">Cargando…</p><div id="stage"></div></main><script type="module">
import {createRacingWorld} from './racing-world3d.mjs?v=20261112-neumaticos-v2';import {createRace} from './racing-physics.mjs';
const host=document.querySelector('#stage'),world=await createRacingWorld(host),race=createRace();race.playerPaint='black';race.photoCars=true;let mode='finish';
function draw(){world.resize(host.clientWidth,host.clientHeight);if(mode==='finish')world.render(race,{replay:{distance:0,winner:{player:true,model:'octavia',pilot:'Alberto Uceda'}}});else{race.phase='running';race.distance=80;race.rivals.forEach((r,i)=>{r.distance=95+i*14;r.x=i*.2;});world.render(race,{view:'chase'});}document.querySelector('#status').textContent='Coche negro conservado · comprobación de contacto de neumáticos y sombra · bandas artificiales retiradas · revisión 2';}
document.querySelector('#finish').onclick=()=>{mode='finish';draw()};document.querySelector('#drive').onclick=()=>{mode='drive';draw()};onresize=draw;draw();window.circuitCheck={world,race,host,draw,ready:true};
</script></html>
