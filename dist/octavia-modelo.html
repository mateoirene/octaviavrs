<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Octavia Mk4 · estudio 3D</title><style>body{margin:0;background:#101820;color:#eef2f5;font:16px system-ui}header{padding:16px;position:absolute;z-index:2}h1{font-size:20px;margin:0 0 8px}button,a{background:#17212b;border:1px solid #71818f;color:white;padding:12px;display:inline-block;margin:3px;border-radius:6px;text-decoration:none}canvas{display:block;width:100vw;height:100vh}small{display:block;max-width:600px}</style><header><h1>Octavia RS Mk4 · estudio de carrocería</h1><small>Geometría original editable. Versión experimental; no es un modelo oficial ni una reproducción CAD.</small><div><button data-view="front">Delante</button><button data-view="rear">Detrás</button><button data-view="side">Lateral</button><a href="simulador.html?experience=highway">Conducir</a></div><small id="status">Cargando modelo…</small></header><script type="module">
import * as T from './vendor/three.module.js';import {GLTFLoader} from './vendor/GLTFLoader.js';import {HDRLoader} from './vendor/HDRLoader.js';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#202b35');const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.05,100);const light=new T.DirectionalLight('#fff3e5',4);light.position.set(-3,7,-4);light.castShadow=true;light.shadow.mapSize.set(1024,1024);light.shadow.camera.left=-5;light.shadow.camera.right=5;light.shadow.camera.top=5;light.shadow.camera.bottom=-5;light.shadow.normalBias=.025;scene.add(light,new T.HemisphereLight('#d8e8ff','#8b8379',2));const floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:'#424a50',roughness:.78}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const model=(await new GLTFLoader().loadAsync('assets/highway/octavia-mk4.glb')).scene;model.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;for(const m of Array.isArray(n.material)?n.material:[n.material])if(/Glass/.test(m.name)){m.transparent=true;m.opacity=.42;m.depthWrite=false;}}});scene.add(model);const bounds=new T.Box3().setFromObject(model),size=bounds.getSize(new T.Vector3());model.position.y-=bounds.min.y;
try{const hdr=await new HDRLoader().loadAsync('assets/track3d/sky.hdr');hdr.mapping=T.EquirectangularReflectionMapping;const pmrem=new T.PMREMGenerator(renderer);scene.environment=pmrem.fromEquirectangular(hdr).texture;pmrem.dispose();hdr.dispose();}catch{}
function render(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);}
function view(name){const p={front:[-4.8,2,-6.6],rear:[4.8,2,6.6],side:[-8,1.6,.15]}[name];camera.position.set(...p);camera.lookAt(0,.72,0);render();}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>view(b.dataset.view);onresize=render;view('front');window.octaviaShowroom={view,ready:true,size:size.toArray(),wheels:[]};model.traverse(n=>{if(/^Wheel_/.test(n.name))octaviaShowroom.wheels.push({name:n.name,position:n.getWorldPosition(new T.Vector3()).toArray()});});document.querySelector('#status').textContent='Modelo cargado · '+size.toArray().map(v=>v.toFixed(2)).join(' × ')+' m';
</script></html>
