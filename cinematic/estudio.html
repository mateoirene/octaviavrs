<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;background:#050607;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#titulo{position:fixed;left:0;right:0;bottom:4%;text-align:center;color:#f1f2f2;font-family:Arial,sans-serif;letter-spacing:.14em;opacity:0;text-shadow:0 2px 16px #000}#titulo strong{display:block;font-size:2.5vw;font-weight:500}#titulo span{display:block;font-size:1.25vw;letter-spacing:.35em;margin-top:.6vw}#disclaimer{position:fixed;left:3%;bottom:3%;font:12px Arial;color:#929697;letter-spacing:.04em}</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body><div id="titulo"><strong>ŠKODA OCTAVIA <b style="color:#ff3d3d">v</b>RS 2026</strong><span>MÁS QUE UN COCHE</span></div><div id="disclaimer">INTERPRETACIÓN ARTÍSTICA · CLUB OCTAVIA VRS</div><script type="module">

import {RoomEnvironment} from './vendor/RoomEnvironment.js';

const params=new URLSearchParams(location.search),W=+(params.get('w')||1920),H=+(params.get('h')||1080);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});renderer.setSize(W,H,false);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#050607');scene.fog=new T.FogExp2('#050607',.018);

function area(color,intensity,position){const light=new T.DirectionalLight(color,intensity);light.position.set(...position);scene.add(light);return light;}
const key=area('#f7f2e8',2.8,[-3,-5,7]);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-8,right:8,top:8,bottom:-8,far:25,near:.5});key.shadow.normalBias=.02;key.shadow.bias=-.0003;
area('#dbe9ff',2.5,[5,2,6]);area('#ff2635',2.6,[-6,0,2]);area('#37e57b',1.9,[6,1,3]);
const floor=new T.Mesh(new T.PlaneGeometry(70,70),new T.MeshBasicMaterial({color:'#050607'}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;floor.position.y=-.02;scene.add(floor);
const mirror=new Reflector(new T.PlaneGeometry(35,35),{color:'#272b2d',textureWidth:768,textureHeight:432,clipBias:.003});mirror.rotation.x=-Math.PI/2;mirror.position.y=-.018;scene.add(mirror);
const shadow=new T.Mesh(new T.PlaneGeometry(40,40),new T.ShadowMaterial({opacity:.45}));shadow.rotation.x=-Math.PI/2;shadow.position.y=-.012;shadow.receiveShadow=true;scene.add(shadow);
for(const [x,color]of [[-5.7,'#fd1729'],[5.7,'#16b857']]){const neon=new T.Mesh(new T.BoxGeometry(.028,.016,18),new T.MeshBasicMaterial({color}));neon.position.set(x,.006,0);scene.add(neon);const glow=new T.PointLight(color,8,12,2);glow.position.set(x,.18,0);scene.add(glow);}
const camera=new T.PerspectiveCamera(34,W/H,.08,120);window.camera=camera;
const gltf=await new GLTFLoader().loadAsync('./octavia-art.glb');const car=gltf.scene;
// Conversión de coordenadas Blender Z-arriba a Three Y-arriba la hace glTF.
scene.add(car);car.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.material.side=T.DoubleSide;if(o.material.transparent)o.material.depthWrite=false;}});
const groups={};for(const name of ['chasis','capo','frontal','trasera','faros','porton','techo','panel_izq','panel_der','puerta_di','puerta_dd','puerta_ti','puerta_td','motor','transmision','suspension_di','suspension_dd','suspension_ti','suspension_td','freno_di','freno_dd','freno_ti','freno_td','rueda_di','rueda_dd','rueda_ti','rueda_td','salpicadero','pantalla','consola','asiento_i','asiento_d','asientos_traseros']){const o=car.getObjectByName(name);if(!o)throw Error('Falta grupo '+name);groups[name]={o,initial:o.position.clone()};}

const moves={capo:[[0,-.6,1.6],8,12],frontal:[[0,-1.8,.1],9,13],trasera:[[0,1.8,.1],9,13],faros:[[0,-2.0,.9],10,14],porton:[[0,1.7,1.5],11,15],techo:[[0,.3,3.3],11.5,16],panel_izq:[[-1.7,0,.45],12,16.5],panel_der:[[1.7,0,.45],12,16.5],puerta_di:[[-2.3,-.4,.4],12.5,17],puerta_dd:[[2.3,-.4,.4],12.5,17],puerta_ti:[[-2.3,.4,.4],13,17.5],puerta_td:[[2.3,.4,.4],13,17.5],motor:[[0,-1.4,1.1],16,20],transmision:[[.9,-1.4,.6],17,21],salpicadero:[[0,-.5,2.15],21,25],pantalla:[[0,-.9,2.6],21.5,25.5],consola:[[0,0,1.7],22,26],asiento_i:[[-.4,.3,1.9],22,26],asiento_d:[[.4,.3,1.9],22,26],asientos_traseros:[[0,1.1,1.9],22.5,26.5]};
for(const side of ['i','d'])for(const axle of ['d','t']){const s=side==='i'?-1:1,k=axle+side;moves['rueda_'+k]=[[s*3.0,0,0],19,23];moves['freno_'+k]=[[s*2.3,0,.15],18,22];moves['suspension_'+k]=[[s*1.3,0,.15],17,21];}
const smooth=(a,b,t)=>{const v=T.MathUtils.clamp((t-a)/(b-a),0,1);return v*v*(3-2*v)};
let topology=[];car.traverse(o=>{if(o.isMesh)topology.push({id:o.uuid,name:o.name,geometry:o.geometry.uuid,count:o.geometry.attributes.position.count});});
// Imágenes de bruma de autor, con semilla fija, presentes toda la toma.
const c=document.createElement('canvas');c.width=c.height=128;const cx=c.getContext('2d'),gradient=cx.createRadialGradient(64,64,0,64,64,64);gradient.addColorStop(0,'rgba(170,185,190,.12)');gradient.addColorStop(1,'rgba(170,185,190,0)');cx.fillStyle=gradient;cx.fillRect(0,0,128,128);const cloudTex=new T.CanvasTexture(c);const clouds=[];for(let i=0;i<7;i++){const sp=new T.Sprite(new T.SpriteMaterial({map:cloudTex,transparent:true,opacity:.12,depthWrite:false}));sp.position.set(Math.sin(i*2)*5,.25,Math.cos(i*2)*4);sp.scale.set(5,1.2,1);scene.add(sp);clouds.push(sp);}
const filmTarget=new T.WebGLRenderTarget(W,H,{type:T.HalfFloatType});filmTarget.depthTexture=new T.DepthTexture(W,H);const postScene=new T.Scene(),postCamera=new T.OrthographicCamera(-1,1,1,-1,0,1);const postMat=new T.ShaderMaterial({uniforms:{image:{value:filmTarget.texture},depth:{value:filmTarget.depthTexture},focus:{value:7},aperture:{value:.0010},aspect:{value:W/H}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',fragmentShader:`uniform sampler2D image;uniform sampler2D depth;uniform float focus;uniform float aperture;uniform float aspect;varying vec2 vUv;void main(){float z=texture2D(depth,vUv).x;float d=(2.*.08*120.)/(120.+.08-(z*2.-1.)*(120.-.08));float r=clamp(abs(d-focus)/max(d,.08)*aperture,0.,.0025);vec3 c=texture2D(image,vUv).rgb;for(int i=0;i<8;i++){float a=float(i)*.785398;vec2 o=vec2(cos(a)/aspect,sin(a))*r;c+=texture2D(image,vUv+o).rgb;}gl_FragColor=vec4(c/9.,1.);
#include <tonemapping_fragment>
#include <colorspace_fragment>
}`});postScene.add(new T.Mesh(new T.PlaneGeometry(2,2),postMat));
window.drawFilm=(t)=>{
 for(const [name,{o,initial}]of Object.entries(groups)){o.position.copy(initial);const move=moves[name];if(move){const p=smooth(move[1],move[2],t),[x,y,z]=move[0];o.position.add(new T.Vector3(x,z,-y).multiplyScalar(p));}}
 // Verificación real por fotograma, sin depender de un contador constante.
 let meshIndex=0;car.traverse(o=>{if(o.isMesh){const before=topology[meshIndex++];if(!o.visible||o.uuid!==before.id||o.geometry.uuid!==before.geometry||o.geometry.attributes.position.count!==before.count)throw Error('Cambio de geometría o visibilidad durante el desmontaje');}});if(meshIndex!==topology.length)throw Error('Apareció o desapareció una pieza');
 // No escala, deformación, visibilidad ni geometría animadas.
 car.rotation.y=T.MathUtils.degToRad(-12+30*smooth(0,8,t));
 const wide=smooth(6,25,t),radius=T.MathUtils.lerp(6.8,15.2,wide),angle=T.MathUtils.degToRad(-40+72*t/30);
 camera.position.set(Math.sin(angle)*radius,2.35+wide*3.1,Math.cos(angle)*radius);camera.lookAt(0,.8+wide*.85,0);
 document.querySelector('#titulo').style.opacity=smooth(26,27,t);clouds.forEach((cloud,i)=>cloud.position.x=Math.sin(i*2)*5+Math.sin(t*.12+i)*.2);
 postMat.uniforms.focus.value=camera.position.distanceTo(new T.Vector3(0,.8+wide*.85,0));postMat.uniforms.aperture.value=T.MathUtils.lerp(.0011,.00035,wide);renderer.setRenderTarget(filmTarget);renderer.render(scene,camera);const worldDraws={calls:renderer.info.render.calls,triangles:renderer.info.render.triangles};renderer.setRenderTarget(null);renderer.render(postScene,postCamera);window.filmState={t,pieces:Object.keys(groups).length,meshes:topology.length,drawCalls:worldDraws.calls,triangles:worldDraws.triangles,width:W,height:H};return window.filmState;
};
window.filmReady=true;window.drawFilm(0);
</script></body></html>
